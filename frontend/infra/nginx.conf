server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA routing: unknown paths (e.g. /catalog, /admin, a page refresh on a
    # client-side route) fall back to index.html instead of a 404 — React
    # Router takes it from there.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Regenerated on every container start (see infra/40-env-config.sh) —
    # never let a browser or proxy cache a stale backend URL.
    location = /env-config.js {
        add_header Cache-Control "no-store";
    }
}
