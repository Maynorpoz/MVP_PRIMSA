services:
  postgres_db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: primsa
      POSTGRES_PASSWORD: primsa
      POSTGRES_DB: primsa
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U primsa -d primsa"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg2://primsa:primsa@postgres_db:5432/primsa
      SECRET_KEY: change-this-secret-in-production
      ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 60
      # Browser origin(s) allowed to call this API (comma-separated). Must
      # include the frontend's own origin, not the backend's.
      CORS_ORIGINS: http://localhost:5173
      # Optional: uncomment to seed the first sales_admin_role account on
      # startup (skipped if unset, or if that email already exists).
      # FIRST_ADMIN_EMAIL: admin@primsa.com
      # FIRST_ADMIN_PASSWORD: change-this-admin-password
    ports:
      - "8000:8000"
    depends_on:
      postgres_db:
        condition: service_healthy

  # Built per frontend/INSTRUCCIONES.md. Runtime config (API_BASE_URL) is
  # injected at container start via infra/40-env-config.sh, not baked in at
  # build time, so the same image works unmodified across environments.
  frontend:
    build:
      context: ./frontend
    restart: unless-stopped
    environment:
      API_BASE_URL: http://localhost:8000
    ports:
      - "5173:80"
    depends_on:
      - backend

  prometheus:
    image: prom/prometheus:v2.55.1
    restart: unless-stopped
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    depends_on:
      - backend

  grafana:
    image: grafana/grafana:11.2.0
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    ports:
      - "3000:3000"
    depends_on:
      - prometheus

volumes:
  postgres_data:
  prometheus_data:
  grafana_data:
